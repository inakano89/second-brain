# Second Brain sem domínio (acesso por http://IP:8080). Para HTTPS use deploy/docker-compose.https.yml.
services:
  second-brain:
    image: ghcr.io/inakano89/second-brain:latest
    # build: .
    container_name: second-brain
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - brain-data:/data            # .env, banco, backups, mídia, binário atualizado
      # Pasta inbox no host (opcional): sudo chown -R 65532:65532 ./inbox
      # - ./inbox:/data/inbox

volumes:
  brain-data:
