name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test release VERSION=${{ github.ref_name }}
      - name: Assinar SHA256SUMS (ed25519)
        if: env.UPDATE_SIGNING_KEY != ''
        run: make sign
      # Se a release já foi criada pela página do GitHub (com "Generate release notes"),
      # o softprops/action-gh-release ACRESCENTA as notas geradas ao texto existente e o
      # "What's Changed" aparece duas vezes. Só gera quando a release não existe ou está sem texto.
      - name: Decidir se gera as notas
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null || true)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/second-brain-*
            dist/SHA256SUMS*
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          # vX.Y.Z → estável e "latest" (instalador e auto-update usam /releases/latest);
          # vX.Y.Z-rc1 etc. → pré-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
